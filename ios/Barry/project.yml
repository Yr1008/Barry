name: Barry
options:
  bundleIdPrefix: com.barry
  deploymentTarget:
    iOS: "17.0"

targets:
  Barry:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Barry
    info:
      path: Barry/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barry.app
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
